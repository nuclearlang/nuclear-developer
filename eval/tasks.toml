# The task bank of the local developer's evaluation: one file each, as a frontier model hands them to it.
# `must`: the texts the answer must contain (its acceptance criteria). `split`: `train` tasks give their frontier
# answer to the graph as an example; `test` tasks are held out and only measure.

[context]
book_models = '''
model NewBook
  @minLength(1)
  title: string
  author: string
  year: int
'''
book_entity = '''
entity Book()
  @primary(generated = true)
  id: int
  title: string
  author: string
  year: int
  available: boolean = true
'''
book_repository = '''
repository BookRepository
  byAuthor(author: string) Book[]
    where({ "author": author })
    orderBy("year")
    getMany()
'''
loan_entity = '''
entity Loan()
  @primary(generated = true)
  id: int
  bookId: int
  reader: string
  returned: boolean = false
'''
create_book = '''
usecase CreateBook(books: BookRepository)
  exec(input: NewBook) Result<Error, Book>
    Ok(~books.save(Book(title = input.title, author = input.author, year = input.year)))
'''

app_book = '''
Book
  id: int
  title: string
  author: string
  available: boolean
'''
app_book_error = '''
BookError
  message: string
'''
app_book_repository = '''
@repository(path = "books")
repository BookRepository
  @get
  all() Result<BookError, Book[]>
'''
app_books_state = '''
BooksState
  (loaded: Book[], error: BookError, loading: boolean)
'''
app_books_component = '''
appcomponent BooksComponent
  all() = AllBooksUseCase.exec
'''

