# --- features: several files, planned and written in order, checked together as a project ---
# `must` texts may be in any file of the feature. The project is a fresh `dragonfly new -p <platform> -d <dialect>`.

[[feature]]
id = "feature-books-by-author"
split = "train"
platform = "backend"
dialect = "fastapi"
spec = "Books by author. An entity Book (id: a generated primary key, title: string, author: string). A repository BookRepository with byAuthor(author: string) Book[] that filters by author and orders by title. A use case BooksOfAuthor(books: BookRepository) whose exec(author: string) returns those books. An application component BooksAppComponent with booksOf() = BooksOfAuthor.exec. A controller BooksController(books: BooksAppComponent) on \"books\" with GET \"author/{author}\" that answers ~books.booksOf(author)."
must = ["entity Book", "@primary(generated = true)", "repository BookRepository", "byAuthor(author: string) Book[]", "usecase BooksOfAuthor", "appcomponent BooksAppComponent", "booksOf() = BooksOfAuthor.exec", "controller BooksController", "@get(\"author/{author}\")"]

[[feature]]
id = "feature-new-reader"
split = "test"
platform = "backend"
dialect = "fastapi"
spec = "Register readers. An entity Reader (id: a generated primary key, name: string, email: string unique). A model NewReader (name: at least 2 characters, email: a valid email). A use case CreateReader(readers: ReaderRepository) whose exec(input: NewReader) saves a Reader with the input's name and email and returns it in a Result. A repository ReaderRepository (no methods of its own). An application component ReadersAppComponent with create() = CreateReader.exec. A controller ReadersController(readers: ReadersAppComponent) on \"readers\" with a POST that answers ~readers.create(input) with status 201."
must = ["@entity(", "Reader", "unique = true", "NewReader", "@email", "usecase CreateReader", "repository ReaderRepository", "appcomponent ReadersAppComponent", "controller ReadersController", "201"]

[[feature]]
id = "feature-books-list-app"
split = "test"
platform = "mobile"
dialect = "flutter"
spec = "The books list of the mobile app, component books. A model Book (id: int, title: string). A model BookError (message: string). A repository BookRepository over the API's \"books\" path with a GET all() that returns Result<BookError, Book[]>. A use case AllBooksUseCase(books: BookRepository) whose exec() returns ~books.all(). An application component BooksComponent with all() = AllBooksUseCase.exec."
must = ["Book", "BookError", "@repository(path = \"books\")", "repository BookRepository", "all() Result<BookError, Book[]>", "usecase AllBooksUseCase", "appcomponent BooksComponent", "all() = AllBooksUseCase.exec"]
